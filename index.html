<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era 2 Season 5: HEISTED Codex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .stat-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .keycard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .keycard-card {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .keycard-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .keycard-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .variants {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .variant-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #ddd;
        }
        
        .variant-checkbox:hover {
            background: #f0f7ff;
            border-color: #667eea;
        }
        
        .variant-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .variant-checkbox input[type="checkbox"]:checked + label {
            color: #667eea;
            font-weight: bold;
        }
        
        .variant-checkbox label {
            cursor: pointer;
            margin: 0;
            flex: 1;
            color: #555;
            font-size: 0.95em;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .modal-text {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9em;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .close:hover {
            color: #000;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }
        
        .copy-btn:hover {
            background: #5568d3;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .keycard-grid {
                grid-template-columns: 1fr;
            }
            
            .variants {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Era 2 Season 5: HEISTED Codex</h1>
        <p class="subtitle">Track your keycard collection and share your progress</p>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="collectedCount">0</div>
                <div class="stat-label">Collected</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Available</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="progressPercent">0%</div>
                <div class="stat-label">Completion</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-primary" onclick="selectAll()">✓ Select All</button>
            <button class="btn-secondary" onclick="deselectAll()">✗ Deselect All</button>
            <button class="btn-primary" onclick="shareToDiscord()">📤 Share to Discord</button>
            <button class="btn-secondary" onclick="exportData()">⬇️ Export Data</button>
            <button class="btn-secondary" onclick="importData()">⬆️ Import Data</button>
        </div>
        
        <div class="keycard-grid" id="keycardGrid"></div>
    </div>
    
    <div id="shareModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-header">📋 Copy Your Collection</div>
            <p style="color: #666; margin-bottom: 15px;">Paste this into Discord to share your collection:</p>
            <div class="modal-text" id="shareText"></div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
        </div>
    </div>
    
    <input type="file" id="importFile" style="display: none;" accept=".json">

    <script>
        const keycards = [
            'Ghost',
            'Shadow',
            'Boom',
            'Kitty',
            'Commander',
            'Eclipsed',
            'Thunker',
            'MYSTERY',
            'Shark',
            'Security'
        ];
        
        const variants = ['Base', 'Shiny', 'Rainbow', 'Iridescent'];
        
        function initTracker() {
            loadData();
            renderKeycards();
            updateStats();
        }
        
        function renderKeycards() {
            const grid = document.getElementById('keycardGrid');
            grid.innerHTML = '';
            
            keycards.forEach(keycard => {
                const card = document.createElement('div');
                card.className = 'keycard-card';
                
                const variantsHtml = variants.map(variant => {
                    const id = `${keycard}-${variant}`;
                    const isChecked = getData(id) ? 'checked' : '';
                    return `
                        <div class="variant-checkbox">
                            <input 
                                type="checkbox" 
                                id="${id}" 
                                ${isChecked}
                                onchange="updateTracker()"
                            >
                            <label for="${id}">${variant}</label>
                        </div>
                    `;
                }).join('');
                
                card.innerHTML = `
                    <div class="keycard-name">${keycard}</div>
                    <div class="variants">${variantsHtml}</div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function updateTracker() {
            saveData();
            updateStats();
        }
        
        function updateStats() {
            let collected = 0;
            keycards.forEach(keycard => {
                variants.forEach(variant => {
                    if (getData(`${keycard}-${variant}`)) {
                        collected++;
                    }
                });
            });
            
            const total = keycards.length * variants.length;
            const percent = Math.round((collected / total) * 100);
            
            document.getElementById('collectedCount').textContent = collected;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressPercent').textContent = percent + '%';
        }
        
        function selectAll() {
            keycards.forEach(keycard => {
                variants.forEach(variant => {
                    const id = `${keycard}-${variant}`;
                    document.getElementById(id).checked = true;
                });
            });
            updateTracker();
        }
        
        function deselectAll() {
            keycards.forEach(keycard => {
                variants.forEach(variant => {
                    const id = `${keycard}-${variant}`;
                    document.getElementById(id).checked = false;
                });
            });
            updateTracker();
        }
        
        function shareToDiscord() {
            let shareText = '📖 **Era 2 Season 5: HEISTED Codex** 📖\n\n';
            
            keycards.forEach(keycard => {
                const hasVariants = variants.filter(v => getData(`${keycard}-${v}`)).length;
                const variants_str = variants
                    .map(v => getData(`${keycard}-${v}`) ? `✅ ${v}` : `❌ ${v}`)
                    .join(' | ');
                shareText += `**${keycard}**: ${variants_str}\n`;
            });
            
            const collected = document.getElementById('collectedCount').textContent;
            const total = document.getElementById('totalCount').textContent;
            const percent = document.getElementById('progressPercent').textContent;
            
            shareText += `\n**Progress**: ${collected}/${total} (${percent})`;
            
            document.getElementById('shareText').textContent = shareText;
            document.getElementById('shareModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('shareModal').style.display = 'none';
        }
        
        function copyToClipboard() {
            const text = document.getElementById('shareText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✓ Copied to clipboard!');
            });
        }
        
        function exportData() {
            const data = {};
            keycards.forEach(keycard => {
                variants.forEach(variant => {
                    const id = `${keycard}-${variant}`;
                    data[id] = getData(id) || false;
                });
            });
            
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `keycard-collection-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }
        
        function importData() {
            document.getElementById('importFile').click();
        }
        
        document.getElementById('importFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    Object.keys(data).forEach(key => {
                        if (data[key]) {
                            setData(key, true);
                        }
                    });
                    renderKeycards();
                    updateTracker();
                    alert('✓ Data imported successfully!');
                } catch (err) {
                    alert('✗ Error importing file: ' + err.message);
                }
            };
            reader.readAsText(file);
        });
        
        // LocalStorage helpers
        function getData(key) {
            return localStorage.getItem(`keycard_${key}`) === 'true';
        }
        
        function setData(key, value) {
            localStorage.setItem(`keycard_${key}`, value ? 'true' : 'false');
        }
        
        function saveData() {
            keycards.forEach(keycard => {
                variants.forEach(variant => {
                    const id = `${keycard}-${variant}`;
                    const isChecked = document.getElementById(id).checked;
                    setData(id, isChecked);
                });
            });
        }
        
        function loadData() {
            keycards.forEach(keycard => {
                variants.forEach(variant => {
                    const id = `${keycard}-${variant}`;
                    const checkbox = document.getElementById(id);
                    if (checkbox && getData(id)) {
                        checkbox.checked = true;
                    }
                });
            });
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('shareModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', initTracker);
    </script>
</body>
</html>
